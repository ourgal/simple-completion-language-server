# Builds https://github.com/estin/simple-completion-language-server (scls)
# from source and publishes the binaries as a release in THIS repository.
#
# Usage: Actions -> "Build and release scls binaries" -> Run workflow
#   - upstream_ref: branch/tag/commit of the upstream repo (default: main)
#   - tag: release tag to create here; leave empty to auto-name it
#     "scls-<upstream commit sha>" (upstream has no tags, so the commit
#     short SHA identifies the build)
#   - citation: enable the optional `citation` completion feature
#
# Builds with `--locked`, matching upstream's recommended install:
#   cargo install --locked --git https://github.com/estin/simple-completion-language-server.git
name: Build and release scls binaries

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 'Upstream branch/tag/commit to build'
        required: false
        default: main
        type: string
      tag:
        description: 'Release tag here (empty = scls-<commit sha>)'
        required: false
        type: string
      citation:
        description: 'Build with the citation feature enabled'
        required: false
        default: false
        type: boolean

env:
  UPSTREAM_REPO: estin/simple-completion-language-server
  BIN_NAME: simple-completion-language-server

jobs:
  build:
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      upstream_sha: ${{ steps.tag.outputs.upstream_sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout upstream source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ inputs.upstream_ref }}
          path: scls

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          SHA="$(git -C scls rev-parse HEAD)"
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="scls-${SHA::8}"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: scls

      - name: Build
        shell: bash
        working-directory: scls
        run: |
          FEATURES=""
          if [ "${{ inputs.citation }}" = "true" ]; then
            FEATURES="--features citation"
          fi
          cargo build --release --locked --target ${{ matrix.target }} $FEATURES

      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            BIN="${BIN_NAME}.exe"
          else
            BIN="$BIN_NAME"
          fi
          # avoid doubling the prefix when TAG is auto-derived ("scls-<sha>")
          DIR="scls-${TAG#scls-}-${TARGET}"
          mkdir -p "$DIR" dist
          cp "scls/target/$TARGET/release/$BIN" "$DIR/"
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip "dist/${DIR}.zip" "$DIR" >/dev/null
          else
            tar -czf "dist/${DIR}.tar.gz" "$DIR"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: ${{ needs.build.outputs.tag }}
          files: dist/*
          fail_on_unmatched_files: true
          body: |
            Prebuilt binaries of [simple-completion-language-server](https://github.com/${{ env.UPSTREAM_REPO }}).

            Built from upstream `${{ inputs.upstream_ref }}` @ `${{ needs.build.outputs.upstream_sha }}` with `cargo build --release --locked`.
            Built with the `citation` feature: ${{ inputs.citation }}
